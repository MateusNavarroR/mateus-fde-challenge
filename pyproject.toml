[project]
name = "autoseguro-agente"
version = "0.1.0"
description = "Agente de cotacao de seguro auto — desafio FDE Namastex"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "agno>=2.7",
    "anthropic>=0.40",
    # `anthropic` e `ollama` não são importados por nenhum arquivo nosso: quem os
    # carrega é o Agno, conforme a model-string. Estão aqui porque a model-string
    # falha em tempo de execução sem eles.
    "ollama>=0.4",
    # ⚠️ Transitiva do layout do Agno, e **não** é dependência morta.
    #
    # `agno.models.ollama` importa `OllamaResponses`, que importa
    # `agno.models.openai.open_responses`, que levanta `ImportError` sem o SDK. Ou
    # seja: o SDK da OpenAI é necessário para o caminho OLLAMA funcionar, sem que
    # nenhuma chamada à OpenAI aconteça.
    #
    # O passe de cadeia de suprimentos marcou esta linha como "dependência que
    # ninguém importa" e ela foi removida — erradamente. A verificação com o módulo
    # de fato escondido reprovou a remoção, e `tests/nucleo/test_dependencias.py`
    # agora guarda a conclusão para que ninguém a refaça pelo mesmo raciocínio.
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: exige a /quote rodando (QUOTE_API_URL, default http://localhost:8001)",
    "serial: depende de QUOTE_SEED — roda em serie, com restart do container antes",
    "db: exige Postgres (APP_DATABASE_URL)",
    "integracao: sobe o compose de verdade; minutos, roda no portao final",
    "modelo: chama o LLM de verdade; custa dinheiro e roda sob demanda",
]

[tool.uv]
package = false
