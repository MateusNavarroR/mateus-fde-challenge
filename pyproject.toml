[project]
name = "autoseguro-agente"
version = "0.1.0"
description = "Agente de cotacao de seguro auto — desafio FDE Namastex"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "agno>=2.7",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: exige a /quote rodando (QUOTE_API_URL, default http://localhost:8001)",
    "serial: depende de QUOTE_SEED — roda em serie, com restart do container antes",
    "db: exige Postgres (APP_DATABASE_URL)",
]

[tool.uv]
package = false
