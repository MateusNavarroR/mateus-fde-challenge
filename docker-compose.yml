# Um comando sobe tudo: `docker compose up`.
#
# Uma única variável de ambiente OBRIGATÓRIA: ANTHROPIC_API_KEY.
# ADMIN_TOKEN é opcional — sem ele a aplicação sobe e avisa no log.
#
# DUAS REGRAS DE PORTA, e as duas existem para o avaliador conseguir rodar:
#
# 1. Publica-se **só a 8080**. O app fala com `db:5432` e `quote-api:8000` pela rede
#    interna do compose — publicá-las no host não serve a aplicação, só à depuração.
#    E publicar cria conflito garantido: quem tem Postgres instalado colide na 5432,
#    e quem rodou o `docker compose up` do repositório do desafio para ver a API —
#    que é o caminho natural antes de olhar esta entrega — já tem a 8000 ocupada.
#    "Port is already allocated" antes de uma linha nossa rodar reprovaria o
#    critério nº 1 por uma conveniência de depuração.
#
#    Quem quiser as portas para depurar: `docker compose --profile debug up`.
#
# 2. O que se publica vai em **127.0.0.1**, nunca em 0.0.0.0 — é o que torna a
#    superfície administrativa inalcançável da rede, independente de autenticação.
#    O compose do desafio publica em 0.0.0.0; este não repete isso.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoseguro
    # Sem `ports` no caminho padrão: o app alcança por `db:5432` na rede do compose.
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoseguro"]
      interval: 2s
      timeout: 3s
      retries: 30

  quote-api:
    build: ./quote-service
    environment:
      # A instabilidade simulada do legado, nos valores do desafio.
      QUOTE_FAILURE_RATE: "${QUOTE_FAILURE_RATE:-0.20}"
      QUOTE_SLOW_RATE: "${QUOTE_SLOW_RATE:-0.10}"
      QUOTE_SLOW_SECONDS: "${QUOTE_SLOW_SECONDS:-8}"
      QUOTE_SEED: "${QUOTE_SEED:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/autoseguro
      APP_QUOTE_API_URL: http://quote-api:8000
      APP_LLM_MODEL: "${APP_LLM_MODEL:-anthropic:claude-opus-5}"
      # Sem default: quem não exportar, não sobe o caminho Anthropic.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # Opcional. Definido ⇒ exigido; ausente ⇒ a aplicação sobe e avisa no log.
      APP_ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Login da área de operação, também opcional e também sem default. Sem as
      # duas, o /admin abre direto — que é o caminho de um comando, e o que a
      # proteção efetiva cobre é o bind em 127.0.0.1 acima.
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      quote-api:
        condition: service_healthy
    # Sem isto, `docker compose up --wait` retorna quando o contêiner está RODANDO,
    # não quando está SERVINDO — e quem seguir o README recebe conexão recusada por
    # alguns segundos, sem saber se é lentidão ou defeito.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ─── perfil `debug`: as portas de depuração, para quem optar ────────────────
  # `docker compose --profile debug up` publica banco e quote-api no host. Fora
  # dele, nada além da 8080 é exposto — e o caminho padrão não tem conflito possível.

  db-debug:
    extends:
      service: db
    profiles: ["debug"]
    ports:
      - "127.0.0.1:5432:5432"

  quote-api-debug:
    extends:
      service: quote-api
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8000:8000"

  # ─── o banco da AVALIAÇÃO, separado do banco da aplicação ──────────────────
  #
  # Duas coisas quebraram por não existir, e as duas custaram uma execução inteira:
  #
  # 1. a suíte roda `TRUNCATE ... CASCADE` nas fixtures. Rodar testes durante um
  #    replay deu `DeadlockDetected` e matou a execução no meio;
  # 2. a evidência de uma avaliação não pode viver num banco que alguém derruba. Aqui
  #    ela tem volume PRÓPRIO e nomeado: `docker compose down` não leva junto, e só
  #    `down -v` apaga.
  #
  # Fica no profile `avaliacao` porque `docker compose up` continua sendo um comando
  # só para quem quer o produto — quem vai rodar replay pede explicitamente.
  replay-db:
    image: postgres:16-alpine
    profiles: ["avaliacao"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoseguro_replay
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - replaydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoseguro_replay"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  #: A evidência do replay. Nomeado de propósito: `docker compose down` preserva.
  replaydata:
